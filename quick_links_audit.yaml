review_findings:

  - id: hardcoded-marvis-timestamps
    severity: medium
    file: angular/src/app/pages/api/manage/manage.component.ts
    where: 'orgInsightUrl() - the "Marvis Actions" quick link (~line 1751)'
    problem: >
      The URL contains a hardcoded "start=1745532000&end=1745598080" (a fixed
      2025 window) instead of the page's dynamic start/end query_params like every
      other link in the same function.
    fix: >
      Use the same query_params tail as the sibling links, or drop start/end and
      rely on a duration.

  - id: wired-sle-metrics
    severity: informational
    confidence: low
    file: angular/src/app/pages/api/manage/manage.component.ts
    where: 'sleUrl() case wiredServiceLevels (~line 1857) + sleDetailsUrl() switch cases'
    status: >
      CORRECTED. An earlier draft of this finding claimed "switch-health was
      renamed to switch-health-v2" and told you to rename + add switch-bandwidth.
      That was wrong/unverified - see below.
    verified:
      - 'Extension emits summary-trend for [switch-stc, switch-health, switch-throughput] (read from source).'
      - 'const/insight_metrics (authoritative, via get_mist_constants) lists the valid switch metrics as:
         switch-by-bytes, switch-health, switch-metrics, switch-stc, switch-stc-new, switch-throughput.'
      - 'So switch-stc, switch-health and switch-throughput are ALL still valid -> the existing wired-SLE
         quick links are NOT broken and need no rename. switch-health-v2 is NOT in the constant.'
    observed_but_unconfirmed:
      - 'Live wired-SLE tab (gc1, 2026-07) additionally requested summary-trend for switch-health-v2 and
         switch-bandwidth. Neither is in const/insight_metrics, so they are likely a newer or SLE-internal
         metric set - not something to adopt blindly.'
      - 'const/insight_metrics does carry "switch-stc-new" (a newer variant of switch-stc) that the extension
         does not use.'
    recommendation: >
      No change required for correctness. If you want the newer wired metrics, first confirm each returns 200
      on  sites/{site_id}/sle/site/{site_id}/metric/{m}/summary-trend  for a site that has switches (I could
      not run this GET - the Chrome extension was disconnected at correction time). Only then decide whether
      to add switch-bandwidth / switch-stc-new or move to switch-health-v2.

  - id: location-sle-missing
    severity: low
    see: 'gaps -> Monitor > Service Levels > Location'
