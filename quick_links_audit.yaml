# =============================================================================
# Mist Browser Extension - Quick Links coverage audit
# =============================================================================
# Purpose : verify the extension detects each Mist dashboard URL as expected
#           and proposes the important Mist API "Quick Links" for that page.
#
# Method  : (1) static analysis of the router
#               angular/src/app/pages/api/manage/manage.component.ts
#               (regex dispatch in parseOrgUrl / parseMspUrl -> forge* helpers)
#           (2) live walk of every left-nav section + sub-menu on a real,
#               authenticated session, recording the actual current route hash
#               and the api/v1 calls each page fires (Resource Timing API).
#           (3) every PROPOSED endpoint below is verified to exist in the public
#               spec mist_openapi/mist.openapi.json (see endpoint_verification
#               fields). Endpoints under /api/v1/labs/... are beta and are NOT in
#               the public spec - flagged as such, never proposed as the primary.
#
# Test org: TM-LAB  (cloud manage.gc1.mist.com)
#   org_id  : 8aa21779-1178-4357-b3e0-42c02b93b870
#   site_id : 51dcce54-0eec-47c6-b29d-f9494a80ec5d   (site "DNT-RLM")
#   date    : 2026-07-07
#
# coverage values:
#   covered  - router matches the URL and emits the expected quick link(s)
#   gap      - router does NOT match the URL (no quick links emitted)
#
# URL params come from  /admin/?org_id=<org_id>#!<route>
# Placeholders: {org_id} {site_id} {obj_id} {device_uuid} {mac} {period} {start} {stop}
# 'current_links' are paths relative to  https://api.{host}/api/v1
# =============================================================================

summary:
  entries_listed: 90          # 82 covered + 8 gaps below (includes detail/sub-page variants)
  covered: 82
  gaps: 8
  distinct_nav_destinations: ~66   # collapsing detail/variant pages onto one handler
  headline: >
    Coverage is very broad - essentially the entire Monitor / Clients / Devices /
    Site / Organization / MSP tree is handled. The gaps are newer or niche pages
    (Marvis Actions, the Location SLE tab, Location Diagnostics, and 4
    analytics/ML pages with no stable REST endpoint). Two existing links also
    show drift - see review_findings.
  gaps_list:
    - "#!virtualAssistant/action          (Marvis > Marvis Actions)       - HIGH value"
    - "#!dashboard/locationServiceLevels   (Monitor > SLE > Location tab)  - MEDIUM value"
    - "#!locationDiagnostics/{site_id}     (Location > Diagnostics)        - MEDIUM value"
    - "#!occupancyAnalytics/site/{site_id} (Analytics > Occupancy)         - MEDIUM value"
    - "#!networkAnalytics/{site_id}        (Analytics > Network Analytics) - LOW value"
    - "#!topology/detail                   (Org > Network Topology)        - LOW value (labs/beta)"
    - "#!canvas                            (Analytics > Analyze)           - LOW value (no REST)"
    - "#!rfGlassesPlayback/{site_id}       (Location > RF Env Replay)      - LOW value (no REST)"

# -----------------------------------------------------------------------------
# GAPS - pages with NO quick links today + proposed additions
# -----------------------------------------------------------------------------
gaps:

  - page: Marvis > Marvis Actions
    url: "#!virtualAssistant/action"
    params: [org_id]
    coverage: gap
    reason: >
      Router matches obj="virtualAssistant" which is NOT in org_common_objs, so
      accept() fails and no handler runs.
    api_calls_observed_beta:   # what the UI actually calls - all under /labs/, NOT in the public spec
      - "/api/v1/labs/orgs/{org_id}/marvis_actions?start&end&interval&query"
      - "/api/v1/labs/orgs/{org_id}/suggestion?start&end&page&limit&query&resolve_wcid"
      - "/api/v1/labs/orgs/{org_id}/suggestions?active&display_priority&query"
      - "/api/v1/labs/suggestions_schema"
    proposed_quick_links:
      # There is NO public /orgs/{org_id}/suggestions endpoint (verified against
      # mist_openapi/mist.openapi.json). The documented public way to read Marvis
      # Actions is the alarms API with group=marvis - the SAME pattern the
      # extension already uses in orgInsightUrl() for its "Marvis Actions" links.
      - name: "Marvis Actions"
        url: "https://api.{host}/api/v1/orgs/{org_id}/alarms/search?group=marvis&duration=1d&limit=1000"
      - name: "Marvis Actions count"
        url: "https://api.{host}/api/v1/orgs/{org_id}/alarms/count?interval=3600&group=marvis&distinct=time&duration=1d"
    implementation_hint: >
      Add "virtualassistant" to org_common_objs + a case in commonOrgUrl (or a
      dedicated regex ^virtualAssistant/action) that reuses the alarms group=marvis
      links already built in orgInsightUrl. NOTE: no public /orgs/{org_id}/suggestions
      endpoint exists - "suggestion" appears in the spec only at MSP scope
      (/msps/{msp_id}/suggestion/count, already used by commonMspUrl); the org-level
      marvis_actions/suggestions endpoints are /labs/ (beta) only.
    endpoint_verification: "vs mist_openapi/mist.openapi.json: alarms/search + alarms/count EXIST; orgs/{org_id}/suggestions does NOT."

  - page: Monitor > Service Levels > Location (tab)
    url: "#!dashboard/locationServiceLevels/site/{site_id}/{period}/{start}/{stop}/{site_id}"
    params: [org_id, site_id, period, start, stop]
    coverage: gap
    reason: >
      sle_re detail alternation is (serviceLevels|wiredserviceLevels|
      wanServiceLevels|juniperGateway|applicationServiceLevels) - it is missing
      "locationServiceLevels". The other 4 SLE tabs ARE covered.
    ui_sle_panels_observed: ["SDK Connect Time", "Latency", "Teleports", "Dropped Requests", "AP Health"]
    proposed_quick_links:
      pattern: "https://api.{host}/api/v1/sites/{site_id}/sle/site/{site_id}/metric/{metric}/summary-trend?start={start}&end={stop}"
      candidate_metrics: ["sdk-connect-time", "latency", "teleports", "dropped-requests", "ap-health"]
      note: "metric slugs need confirmation on a site with BLE/asset data (empty test site fired no location SLE calls)."
      endpoint_verification: "vs spec: the summary-trend path sle/{scope}/{scope_id}/metric/{metric}/summary-trend EXISTS; only the location metric slugs are unconfirmed."
    implementation_hint: >
      Add "locationServiceLevels" to the sle_re detail group + a matching case in
      sleUrl() that calls forgeSlehUrl(..., locationMetrics, ...).

  - page: Location > Location Diagnostics
    url: "#!locationDiagnostics/{site_id}"
    params: [org_id, site_id]
    coverage: gap
    api_calls_observed:
      - "/api/v1/sites/{site_id}/location/ml/current"
      - "/api/v1/sites/{site_id}/maps"
      - "/api/v1/sites/{site_id}/beacons"
    proposed_quick_links:
      - name: "Site Maps"
        url: "https://api.{host}/api/v1/sites/{site_id}/maps"
      - name: "Site Beacons"
        url: "https://api.{host}/api/v1/sites/{site_id}/beacons"
      - name: "Location ML settings"
        url: "https://api.{host}/api/v1/sites/{site_id}/location/ml/current"
    endpoint_verification: "vs spec: maps, beacons, location/ml/current all EXIST (also observed live)."

  - page: Analytics > Occupancy Analytics
    url: "#!occupancyAnalytics/site/{site_id}"
    params: [org_id, site_id]
    coverage: gap
    api_calls_observed: []   # empty test site loads zone data on-demand
    proposed_quick_links:
      - name: "Site Zones stats"
        url: "https://api.{host}/api/v1/sites/{site_id}/stats/zones"
      - name: "Zone visits"
        url: "https://api.{host}/api/v1/sites/{site_id}/zones/visits/search?duration=1d&interval=3600"
    endpoint_verification: "vs spec: stats/zones EXISTS; visits path is documented as {zone_type}/visits/search (zone_type=zones) and is already used by forgeAsset(). No live calls captured (empty test site)."

  - page: Analytics > Network Analytics
    url: "#!networkAnalytics/{site_id}"
    params: [org_id, site_id]
    coverage: gap
    api_calls_observed:
      - "/api/v1/orgs/{org_id}/uisettings?purpose"
    proposed_quick_links: []
    note: >
      Data is loaded on-demand after selecting dimensions; no stable per-page REST
      endpoint observed. Low priority - likely not worth a quick link.

  - page: Organization > Network Topology
    url: "#!topology/detail"
    params: [org_id]
    coverage: gap
    api_calls_observed:
      - "/api/v1/labs/orgs/{org_id}/topology"
      - "/api/v1/labs/orgs/{org_id}/count/topology"
    proposed_quick_links:
      - name: "Network Topology (beta)"
        url: "https://api.{host}/api/v1/labs/orgs/{org_id}/topology"
    note: "Marvis 'Network Topology' - only /labs/ (beta) endpoints exist; low priority."

  - page: Analytics > Analyze
    url: "#!canvas"
    params: [org_id]
    coverage: gap
    proposed_quick_links: []
    note: "Marvis data-explorer (BETA). No stable REST endpoint; skip."

  - page: Location > RF Environment Replay
    url: "#!rfGlassesPlayback/{site_id}"
    params: [org_id, site_id]
    coverage: gap
    proposed_quick_links: []
    note: "RF capture/replay (streaming/ML). No obvious REST quick link; skip."

